name: Release
run-name: Release ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.actor == 'aarondfrancis'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Normalize version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          VERSION="${INPUT_VERSION#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$INPUT_VERSION'. Expected X.Y.Z or vX.Y.Z"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Promote changelog and extract release notes
        run: |
          chmod +x .github/scripts/parse-changelog.sh
          OUTPUT_FILE=release_notes.md .github/scripts/parse-changelog.sh release "$VERSION"

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update changelog for $TAG"
          git push origin HEAD

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
